name: Profile dashboard

on:
  schedule:
    # Once a day, shortly after midnight UTC: the dashboard shown is picked from the UTC date.
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency: dashboard

jobs:
  # Runs third-party code (Bun and npm packages) with the profile token, so it gets no write access to this repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install generator dependencies
        working-directory: .dashboard
        run: bun install --frozen-lockfile
      - name: Build cards and README
        run: bun .dashboard/build.ts --out .
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SUMMARY_CARDS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: |
            README.md
            cards/
          if-no-files-found: error
          retention-days: 1

  # Holds the only write permission and runs nothing but git on the files the build produced.
  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drop the previous cards so removed ones do not linger
        run: git rm -rq --ignore-unmatch cards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard
      - name: Commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards
          git diff --cached --quiet && exit 0
          git commit -m "Refresh the profile dashboard"
          git push || { git pull --rebase && git push; }
